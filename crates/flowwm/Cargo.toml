[package]
name = "flowwm"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A native, agent-first workflow extension for Niri"
license = "GPL-3.0-or-later"

[dependencies]
flow-core = { path = "../flow-core" }
flow-builtins = { path = "../flow-builtins" }
flow-host = { path = "../flow-host" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
directories = "6"
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
gtk4-layer-shell = "0.8"
libc = "0.2"
niri-ipc = { path = "../../components/niri/niri-ipc" }
niri-config = { path = "../../components/niri/niri-config" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
wayland-client = { version = "0.31.15", features = ["system"] }
wayland-backend = { version = "0.3.17", features = ["client_system"] }
wayland-scanner = "0.31.11"
uuid = { version = "1", features = ["v4", "serde"] }
[dev-dependencies]
tempfile = "3"

[[bin]]
name = "flowwm"
path = "src/main.rs"

[[bin]]
name = "flowwm-shell"
path = "src/shell_main.rs"

[[bin]]
name = "flowwm-desktop"
path = "src/desktop_main.rs"
